name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release StrmAssistant.sln

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAssistantLite
          path: StrmAssistant/bin/Release/**/*.dll
          if-no-files-found: warn
